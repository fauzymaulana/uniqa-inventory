server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Ukuran maksimum upload file (sesuaikan dengan kebutuhan)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Semua request diarahkan ke index.php (Laravel routing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Eksekusi PHP via PHP-FPM (container "app" port 9000)
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeout untuk request yang lama (export Excel, dll.)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Blokir akses ke file tersembunyi (.env, .git, dll.)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Cache untuk asset statis (CSS, JS, gambar, font)
    location ~* \.(css|js|gif|ico|jpeg|jpg|png|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options         "SAMEORIGIN"             always;
    add_header X-Content-Type-Options  "nosniff"                always;
    add_header X-XSS-Protection        "1; mode=block"          always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
