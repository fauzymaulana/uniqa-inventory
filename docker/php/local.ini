; Custom PHP configuration untuk production

; Ukuran upload & post (sesuaikan dengan kebutuhan import Excel)
upload_max_filesize = 50M
post_max_size = 55M

; Batas memori per request (maatwebsite/excel butuh cukup memori)
memory_limit = 256M

; Timeout eksekusi (untuk export laporan besar)
max_execution_time = 300
max_input_time = 300

; Timezone
date.timezone = Asia/Jakarta

; Error reporting (matikan di production)
display_errors = Off
display_startup_errors = Off
log_errors = On

; Session
session.gc_maxlifetime = 86400
