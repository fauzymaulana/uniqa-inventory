services:

  # -------------------------------------------------------
  # app: PHP-FPM (Laravel application)
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniqa_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-id}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-inventory_control}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      JWT_SECRET: ${JWT_SECRET}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${APP_NAME:-"Inventory Control System"}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uniqa_network

  # -------------------------------------------------------
  # nginx: Web server (proxy ke PHP-FPM)
  # -------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: uniqa_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - uniqa_network

  # -------------------------------------------------------
  # db: PostgreSQL database
  # -------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: uniqa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory_control}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-inventory_control}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - uniqa_network

  # -------------------------------------------------------
  # queue: Laravel Queue Worker
  # -------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniqa_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-inventory_control}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      JWT_SECRET: ${JWT_SECRET}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uniqa_network

# -------------------------------------------------------
# Named volumes (data persisten)
# -------------------------------------------------------
volumes:
  pgdata:
    driver: local
  app_storage:
    driver: local
  app_bootstrap_cache:
    driver: local

# -------------------------------------------------------
# Network
# -------------------------------------------------------
networks:
  uniqa_network:
    driver: bridge
